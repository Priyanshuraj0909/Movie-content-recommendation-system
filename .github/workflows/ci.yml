name: Python CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Run tests
        run: python -m pytest -q
      - name: Run Ruff
        run: python -m ruff check .

      - name: Validate browser JavaScript
        run: node --check frontend/web/app.js
      - name: Install Chromium
        if: matrix.python-version == '3.12'
        run: python -m playwright install --with-deps chromium --only-shell
      - name: Browser journeys
        if: matrix.python-version == '3.12'
        run: python -m pytest browser_tests -q
      - name: Real CPU encoder smoke check
        if: matrix.python-version == '3.12'
        run: python scripts/verify_encoder.py
